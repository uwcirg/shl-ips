<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        box-sizing: border-box;
        background: #f8f9fa;
        color: #212529;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      main {
        max-width: 28rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1.25rem;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        padding: 0.5rem 1.25rem;
        border-radius: 0.375rem;
        background: #0d6efd;
        color: #fff;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        This app needs an internet connection to view your health data. Check your connection and
        try again.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
