name: Rebuild test branch

on:
  push:
    branches:
      - 'feature/**'   # adjust to match your feature branch naming
      - main            # in case the manifest itself changed
  workflow_dispatch: {}       # manual "rebuild now" button

permissions:
  contents: write
  pull-requests: write   # needed to comment on skipped branches' PRs

concurrency:
  group: rebuild-test-branch
  cancel-in-progress: true   # a newer push supersedes an in-flight rebuild

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # need full history for merges

      - name: Rebuild test branch
        run: |
          chmod +x rebuild-test-branch.sh
          ./rebuild-test-branch.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on skipped branches' PRs
        if: always()
        run: |
          if [ ! -s skipped.txt ]; then
            echo "Nothing skipped, nothing to comment."
            exit 0
          fi
          while IFS= read -r line; do
            branch="${line%%:*}"
            reason="${line#*: }"
            pr_number=$(gh pr list --head "$branch" --json number --jq '.[0].number' || true)
            if [ -n "${pr_number:-}" ] && [ "$pr_number" != "null" ]; then
              gh pr comment "$pr_number" --body "⚠️ Skipped from the latest \`test/auto\` branch rebuild: ${reason}. Resolve the conflict in this branch (merge or rebase the conflicting branch into it, or retarget this PR onto it) so it merges cleanly. Resolving on \`test/auto\` has no effect, since it is rebuilt from scratch each run."
            fi
          done < skipped.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}